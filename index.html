<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enya Nova Go Sonic Controller</title>
    <style>
        :root { --accent: #00f2ff; --bg: #050a14; --card: #121a2d; --dim: #5c6c8c; --success: #28a745; --err: #ff4444; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; overflow: hidden; user-select: none; }
        
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #0d1526; border-bottom: 1px solid #1e2a44; position: sticky; top:0; z-index: 10; }
        .bt-btn { border: 1px solid var(--accent); color: var(--accent); padding: 8px 16px; border-radius: 20px; font-size: 10px; cursor: pointer; background: transparent; transition: 0.3s; font-weight: bold; text-transform: uppercase; }
        .bt-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        .backup-btn { border: 1px solid var(--dim); color: var(--dim); padding: 8px 12px; border-radius: 20px; font-size: 10px; cursor: pointer; background: transparent; margin-right: 5px; }

        .status-bar { font-size: 8px; color: var(--dim); margin-top: 4px; font-family: monospace; display: flex; align-items: center; gap: 5px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--err); }
        .dot.on { background: var(--success); box-shadow: 0 0 5px var(--success); }

        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 15px; height: calc(100vh - 85px); overflow-y: auto; padding-bottom: 100px; box-sizing: border-box; }
        .card { background: var(--card); border-radius: 15px; padding: 10px; border: 1px solid #1e2a44; text-align: center; position: relative; transition: 0.2s; }
        .card:active { transform: scale(0.95); background: #1a253d; }
        .card img { width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover; background: #000; margin-bottom: 8px; }
        .card .name { font-size: 10px; font-weight: bold; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tag { position: absolute; top: 15px; left: 15px; font-size: 7px; color: var(--accent); background: rgba(0,0,0,0.8); padding: 1px 5px; border-radius: 3px; border: 0.5px solid var(--accent); z-index: 2; }

        #drawer { display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 85vh; background: #0d1526; z-index: 1000; flex-direction: column; border-top: 1px solid var(--accent); border-radius: 25px 25px 0 0; box-shadow: 0 -10px 50px #000; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .tabs { display: flex; overflow-x: auto; gap: 15px; padding: 12px 20px; border-bottom: 1px solid #1e2a44; scrollbar-width: none; }
        .tab { font-size: 10px; font-weight: bold; color: var(--dim); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; padding-bottom: 5px; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        
        .controls { flex: 1; overflow-y: auto; padding: 20px; }
        .p-row { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .p-label { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); margin-bottom: 8px; }
        .p-val { color: var(--accent); font-family: monospace; font-weight: bold; }
        
        input[type=range] { width: 100%; -webkit-appearance: none; background: #1a253d; height: 3px; border-radius: 2px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 4px solid #0d1526; }

        .footer { padding: 15px 20px 30px; display: flex; flex-direction: column; gap: 10px; background: #0d1526; border-top: 1px solid #1e2a44; }
        .btn { padding: 14px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        .btn-sync { background: var(--accent); color: #000; }

        #loader { position: fixed; inset:0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        .spin { width: 25px; height: 25px; border: 2px solid #1e2a44; border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader"><div class="spin"></div></div>

<div class="header">
    <div>
        <h1 style="font-size:14px; font-weight:200; margin:0;">NOVA <span style="color:var(--accent); font-weight:900;">SONIC</span></h1>
        <div class="status-bar"><div id="conn-dot" class="dot"></div><span id="conn-text">MIDI OFF</span></div>
    </div>
    <div style="display:flex">
        <button class="backup-btn" onclick="exportOfflineHTML()">БЭКАП</button>
        <button id="bt-status" class="bt-btn" onclick="initMIDI()">Connect</button>
    </div>
</div>

<div id="grid"></div>

<div id="drawer">
    <div style="width:30px; height:3px; background:#1e2a44; margin:10px auto; border-radius:2px;"></div>
    <h2 id="preset-title" style="margin:0 20px; font-weight:300; color:var(--accent); font-size: 16px;">PRESET</h2>
    <div class="tabs" id="tabs"></div>
    <div class="controls" id="controls"></div>
    <div class="footer">
        <button id="sync-btn" class="btn btn-sync" onclick="syncFullPreset()">SYNC TO GUITAR ⚡</button>
        <button class="btn" style="background:#1e2a44; color:#fff;" onclick="closeDrawer()">CLOSE</button>
    </div>
</div>

<script>
    let offlineData = null; 
    let presets = [];
    let currentPreset = null;
    let midiOutput = null;
    const STORAGE_KEY = "enya_nova_cache";

    window.onload = async () => {
        if (offlineData) {
            presets = offlineData;
        } else {
            await syncData();
        }
        renderGrid();
        document.getElementById("loader").style.display = "none";
    };

    async function syncData() {
        const API = "https://overseas-xg.enyamusic.cn";
        const PROXY = "https://api.allorigins.win";
        try {
            const r = await fetch(PROXY + encodeURIComponent(API));
            const j = await r.json();
            const data = JSON.parse(j.contents).data;
            presets = data.flatMap(bank => bank.list.map(p => ({
                ...p,
                bankType: bank.toneType,
                detailObj: JSON.parse(p.toneDetail)
            })));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(presets));
        } catch (e) {
            const cached = localStorage.getItem(STORAGE_KEY);
            if (cached) presets = JSON.parse(cached);
        }
    }

    async function initMIDI() {
        const btn = document.getElementById("bt-status");
        btn.innerText = "ПОИСК...";
        try {
            // Запрос Bluetooth (для активации стека на мобильных)
            if (navigator.bluetooth) {
                await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Enya' }, { namePrefix: 'Nova' }],
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                }).catch(() => console.log("BT Dialog closed"));
            }

            const midi = await navigator.requestMIDIAccess({ sysex: true });
            const outputs = Array.from(midi.outputs.values());
            midiOutput = outputs.find(o => /nova|enya|midi/i.test(o.name)) || outputs[0];

            if (midiOutput) {
                btn.innerText = "ONLINE";
                btn.classList.add("active");
                document.getElementById("conn-dot").classList.add("on");
                document.getElementById("conn-text").innerText = "READY: " + midiOutput.name;
            } else {
                alert("Гитара не обнаружена. Сопрягите её в настройках Bluetooth.");
                btn.innerText = "RETRY";
            }
        } catch (e) {
            alert("MIDI доступ отклонен. Используйте HTTPS и Chrome.");
            btn.innerText = "ERROR";
        }
    }

    function sendEnyaParam(id, val) {
        if (!midiOutput) return;
        let p = new Uint8Array(16);
        p[0]=0xF0; p[1]=0x00; p[2]=0x20; p[3]=0x6B; p[4]=0x7F; p[5]=0x42;
        p[6]=id; p[7]=(val>>7)&0x7F; p[8]=val&0x7F; p[15]=0xF7;
        midiOutput.send(p);
    }

    function renderGrid() {
        const g = document.getElementById("grid");
        g.innerHTML = presets.map((p, i) => `
            <div class="card" onclick="openDrawer(${i})">
                <span class="tag">B${p.bankType} P${p.sort}</span>
                <img src="${p.imgPath}" onerror="this.src='https://via.placeholder.com'">
                <div class="name">${p.name}</div>
            </div>
        `).join("");
    }

    function openDrawer(i) {
        currentPreset = presets[i];
        document.getElementById("preset-title").innerText = currentPreset.name;
        const keys = Object.keys(currentPreset.detailObj);
        document.getElementById("tabs").innerHTML = keys.map((k, idx) => `
            <div class="tab ${idx===0?'active':''}" onclick="switchTab('${k}', this)">${k}</div>
        `).join("");
        document.getElementById("drawer").style.display = "flex";
        switchTab(keys[0], document.querySelector(".tab"));
    }

    function switchTab(key, el) {
        if (!el) return;
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        el.classList.add("active");
        const group = currentPreset.detailObj[key];
        document.getElementById("controls").innerHTML = Object.entries(group).map(([p, v], idx) => {
            if (typeof v !== 'number') return '';
            return `
                <div class="p-row">
                    <div class="p-label"><span>${p}</span><span class="p-val" id="v-${p}">${v}</span></div>
                    <input type="range" value="${v}" oninput="document.getElementById('v-${p}').innerText=this.value" onchange="sendEnyaParam(${idx}, this.value)">
                </div>`;
        }).join("");
    }

    async function syncFullPreset() {
        if (!midiOutput) return alert("Нет связи");
        const btn = document.getElementById("sync-btn");
        btn.innerText = "SENDING...";
        const params = Object.values(currentPreset.detailObj).flatMap(g => Object.values(g).filter(v => typeof v === "number"));
        for (let i = 0; i < params.length; i++) {
            sendEnyaParam(i, params[i]);
            await new Promise(r => setTimeout(r, 45));
        }
        btn.innerText = "SYNCED ✅";
        setTimeout(() => btn.innerText = "SYNC TO GUITAR ⚡", 2000);
    }

    function closeDrawer() { document.getElementById("drawer").style.display = "none"; }

    function exportOfflineHTML() {
        const currentCode = document.documentElement.outerHTML;
        const dataInjection = `let offlineData = ${JSON.stringify(presets)};`;
        const finalCode = currentCode.replace('let offlineData = null;', dataInjection);
        const blob = new Blob([finalCode], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'nova_sonic_offline.html';
        a.click();
    }
</script>
</body>
</html>
