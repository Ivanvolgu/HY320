<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Sonic Controller</title>
    <style>
        :root { --accent: #00f2ff; --bg: #050a14; --card: #121a2d; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 20px; text-align: center; }
        .main-btn { background: var(--accent); color: #000; border: none; padding: 25px 35px; border-radius: 50px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .main-btn:active { transform: scale(0.95); opacity: 0.8; }
        #status { font-size: 10px; color: #5c6c8c; font-family: monospace; margin: 20px 0; line-height: 1.5; border: 1px solid #1e2a44; padding: 10px; border-radius: 10px; min-height: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; padding-bottom: 50px; }
        .card { background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid #1e2a44; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .card.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
    </style>
</head>
<body>

    <h1 style="font-weight: 200; letter-spacing: 4px;">NOVA <span style="font-weight: 900; color:var(--accent)">SONIC</span></h1>
    
    <button id="connect-btn" class="main-btn">PAIR WITH GUITAR</button>
    
    <div id="status">DEVICE STATUS: DISCONNECTED<br>WAITING FOR ACTION...</div>
    
    <div id="grid" class="grid"></div>

<script>
    const SERVICE_UUID = "0000ab11-0000-1000-8000-00805f9b34fb";
    const CHAR_WRITE = "0000ab12-0000-1000-8000-00805f9b34fb";
    
    let writeChar = null;
    let presets = [];

    // Привязка к прямому клику (обязательно для вызова окна Bluetooth)
    document.getElementById('connect-btn').onclick = async function() {
        const log = document.getElementById('status');
        log.innerHTML = "STATUS: REQUESTING DEVICE...";

        try {
            // Ищем именно твое устройство "NOVA Go Sonic System"
            const device = await navigator.bluetooth.requestDevice({
                filters: [
                    { name: 'NOVA Go Sonic System' }, 
                    { namePrefix: 'NOVA' }
                ],
                optionalServices: [SERVICE_UUID]
            });

            log.innerHTML = `STATUS: CONNECTING TO ${device.name}...`;
            const server = await device.gatt.connect();
            
            log.innerHTML = "STATUS: INITIALIZING SERVICE...";
            const service = await server.getPrimaryService(SERVICE_UUID);
            
            log.innerHTML = "STATUS: ACCESSING WRITE CHANNEL...";
            writeChar = await service.getCharacteristic(CHAR_WRITE);
            
            log.innerHTML = `STATUS: CONNECTED ✅<br>READY TO SEND PACKETS`;
            this.style.background = "#28a745";
            this.innerText = "CONNECTED";
            
            // Тестовый пакет при подключении
            sendPacket(0, 50);

        } catch (error) {
            console.error(error);
            log.innerHTML = `<span style="color:#ff4444">ERROR: ${error.message}</span><br>Check HTTPS and Location permissions.`;
        }
    };

    async function sendPacket(id, val) {
        if (!writeChar) return;
        // Тот самый 16-байтовый протокол Enya
        let p = new Uint8Array(16);
        p[0]=0xF0; p[1]=0x00; p[2]=0x20; p[3]=0x6B; p[4]=0x7F; p[5]=0x42;
        p[6]=id; p[7]=(val>>7)&0x7F; p[8]=val&0x7F; p[15]=0xF7;
        
        try {
            await writeChar.writeValue(p);
            document.getElementById('status').innerHTML = `STATUS: TX SUCCESS<br>PARAM: ${id} | VAL: ${val}`;
        } catch(e) { 
            document.getElementById('status').innerHTML = `<span style="color:#ff4444">TX ERROR: ${e.message}</span>`;
        }
    }

    async function loadPresets() {
        try {
            const r = await fetch("https://api.allorigins.win" + encodeURIComponent("https://overseas-xg.enyamusic.cn"));
            const j = await r.json();
            const data = JSON.parse(j.contents).data;
            presets = data.flatMap(bank => bank.list);
            
            const g = document.getElementById('grid');
            presets.slice(0, 20).forEach((p, i) => {
                const d = document.createElement('div');
                d.className = 'card';
                d.innerText = p.name;
                d.onclick = () => {
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
                    d.classList.add('active');
                    sendPacket(i, 100); // Пример: отправка ID пресета
                };
                g.appendChild(d);
            });
        } catch(e) { document.getElementById('status').innerText = "API LOAD ERROR"; }
    }
    loadPresets();
</script>
</body>
</html>
