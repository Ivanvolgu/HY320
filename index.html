<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Sonic: Pro Controller</title>
    <style>
        :root { --accent: #00f2ff; --bg: #050a14; --card: #121a2d; --dim: #5c6c8c; }
        body { background: var(--bg); color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #0d1526; border-bottom: 1px solid #1e2a44; }
        .bt-btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 12px; padding: 15px; height: calc(100vh - 80px); overflow-y: auto; box-sizing: border-box; }
        .card { background: var(--card); border-radius: 18px; padding: 12px; border: 1px solid #1e2a44; text-align: center; position: relative; }
        .card img { width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; background: #000; }
        .card .name { font-size: 10px; font-weight: bold; margin-top: 8px; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
        #loader { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        .spin { width: 30px; height: 30px; border: 2px solid #1e2a44; border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spin"></div>
    <p id="l-status" style="font-size: 10px; color: var(--dim); margin-top: 15px;">СИНХРОНИЗАЦИЯ API...</p>
</div>

<div class="header">
    <div style="font-size: 16px; font-weight: 900;">NOVA <span style="color:var(--accent)">SONIC</span></div>
    <div style="display:flex; gap:10px">
        <button class="bt-btn" style="background:#1e2a44; color:#fff" onclick="exportHTML()">БЭКАП</button>
        <button id="conn-btn" class="bt-btn" onclick="connectBLE()">CONNECT</button>
    </div>
</div>

<div id="grid" class="grid"></div>

<script>
    const SERVICE_UUID = "0000ab11-0000-1000-8000-00805f9b34fb";
    const CHAR_WRITE = "0000ab12-0000-1000-8000-00805f9b34fb";
    let writeChar = null;
    let presets = [];

    // ТВОИ ДАННЫЕ ИЗ ДАМПА
    const AUTH_CONFIG = {
        url: "https://overseas-xg.enyamusic.cn/api/hardware/hardwareTone/list/v2?deviceType=7&deviceId=4627150805080401&specification=0",
        headers: {
            "Authorization": "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJBUFAiLCJsb2dpbk5hbWUiOiJNdXNpYzM0NjkiLCJ0ZWwiOm51bGwsImV4cCI6MTc3MTY1NTY5NywidXNlcklkIjo2NDY2ODI1NzE1NTEyNzcwNTYsImlhdCI6MTc3MTA1MDg5NywiZW1haWwiOiJpdmFudm9sZ3U5ODhAZ21haWwuY29tIn0.hMY_zSqHbf045uvMuEuto1vmSmo3awLAxDSbmNXfHEVk2VC3PJWspPxaaDJii1xoJoPT-ltLFSm2zbpqrxk07A",
            "version": "3.7.2",
            "deviceId": "b6b80c4c-9f2e-3b55-a267-0d56fde72680",
            "randomKey": "b6b80c4c-9f2e-3b55-a267-0d56fde72680"
        }
    };

    window.onload = async () => {
        const cached = localStorage.getItem("nova_offline_data");
        if (cached) {
            presets = JSON.parse(cached);
            renderGrid();
            document.getElementById("loader").style.display = "none";
        } else {
            await fetchPresets();
        }
    };

    async function fetchPresets() {
        // Используем специальный прокси для передачи кастомных хедеров
        try {
            const response = await fetch("https://api.allorigins.win" + encodeURIComponent(AUTH_CONFIG.url));
            const json = await response.json();
            const data = JSON.parse(json.contents).data;
            
            presets = data.flatMap(bank => bank.list || []);
            localStorage.setItem("nova_offline_data", JSON.stringify(presets));
            renderGrid();
            document.getElementById("loader").style.display = "none";
        } catch (e) {
            document.getElementById("l-status").innerText = "ОШИБКА API. ПРОВЕРЬТЕ ТОКЕН.";
            console.error(e);
        }
    }

    async function connectBLE() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'NOVA Go Sonic System' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            writeChar = await service.getCharacteristic(CHAR_WRITE);
            
            const btn = document.getElementById("conn-btn");
            btn.innerText = "ONLINE";
            btn.style.background = "#28a745";
        } catch(e) { alert("BLE Error: " + e.message); }
    }

    function renderGrid() {
        const g = document.getElementById("grid");
        g.innerHTML = presets.map((p, i) => `
            <div class="card" onclick="alert('Preset: ${p.name}')">
                <img src="${p.imgPath}" onerror="this.src='https://via.placeholder.com'">
                <div class="name">${p.name}</div>
            </div>
        `).join("");
    }

    function exportHTML() {
        const currentHTML = document.documentElement.outerHTML;
        const blob = new Blob([currentHTML], {type: "text/html"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "nova_pro_offline.html";
        a.click();
    }
</script>

</body>
</html>
